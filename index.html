<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiensinhsss — Xem & Chia Sẻ Video</title>
  <meta name="description" content="Tiensinhsss - Nền tảng tìm kiếm, xem và chia sẻ video trực tuyến." />
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; }
    header {
      background: #1e293b; padding: 14px 18px; display: flex; flex-wrap: wrap;
      gap: 10px; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #334155;
    }
    .brand { font-size: 1.35rem; font-weight: 800; color: #38bdf8; letter-spacing: 0.5px; }
    .search-box { flex: 1; min-width: 200px; max-width: 420px; }
    input, button {
      padding: 10px 12px; border-radius: 8px; border: 1px solid #475569;
      font-size: 0.95rem;
    }
    input { width: 100%; background: #0f172a; color: #f8fafc; }
    button { background: #0284c7; color: #fff; border: none; font-weight: 600; cursor: pointer; }
    button:hover { background: #0369a1; }
    button.secondary { background: #334155; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 16px; margin-bottom: 20px;
    }
    .upload-grid { display: grid; gap: 10px; }
    .video-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .video-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      overflow: hidden; display: flex; flex-direction: column;
    }
    video, iframe { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 0; }
    .video-info { padding: 12px; }
    .video-title { font-weight: 700; margin: 0 0 6px; font-size: 1rem; }
    .video-meta { font-size: 0.82rem; color: #94a3b8; }
    .status { margin-top: 8px; font-size: 0.9rem; color: #38bdf8; }
    .user-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Tiensinhsss</div>
    <div class="search-box">
      <input id="searchInput" type="search" placeholder="Tìm kiếm video trên Tiensinhsss..." />
    </div>
    <div class="user-bar" id="authArea">
      <button id="loginBtn">Đăng nhập Google</button>
    </div>
  </header>

  <div class="container">
    <div class="card" id="uploadSection" style="display:none;">
      <h3 style="margin-top:0;">Đăng video mới</h3>
      <div class="upload-grid">
        <input id="videoTitle" type="text" placeholder="Tên video / phim" />
        <input id="videoUrl" type="url" placeholder="Dán link video trực tiếp (.mp4) hoặc link embed" />
        <button id="publishBtn">Đăng lên Tiensinhsss</button>
      </div>
      <div class="status" id="uploadStatus"></div>
    </div>

    <div class="card" id="guestNotice">
      Đăng nhập bằng tài khoản Google ở góc trên để đăng video lên <strong>Tiensinhsss</strong>. Khách truy cập có thể tìm kiếm và xem video trực tiếp.
    </div>

    <h3>Danh sách video</h3>
    <div class="video-grid" id="videoList"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcKvdOCQOifuoaez-hFpmf6UtzV3HVnw4",
      authDomain: "tiensinhsss.firebaseapp.com",
      projectId: "tiensinhsss",
      storageBucket: "tiensinhsss.firebasestorage.app",
      messagingSenderId: "293643410016",
      appId: "1:293643410016:web:009dc2495b0c8ea1e50105",
      measurementId: "G-4PW26Q9P0J"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const authArea = document.getElementById("authArea");
    const uploadSection = document.getElementById("uploadSection");
    const guestNotice = document.getElementById("guestNotice");
    const videoList = document.getElementById("videoList");
    const searchInput = document.getElementById("searchInput");

    let currentUser = null;
    let allVideos = [];

    function renderAuthUI(user) {
      currentUser = user;
      if (user) {
        uploadSection.style.display = "block";
        guestNotice.style.display = "none";
        authArea.innerHTML = `
          <span style="font-size:0.88rem;color:#cbd5e1;">${user.displayName || user.email}</span>
          <button class="secondary" id="logoutBtn">Đăng xuất</button>
        `;
        document.getElementById("logoutBtn").onclick = () => signOut(auth);
      } else {
        uploadSection.style.display = "none";
        guestNotice.style.display = "block";
        authArea.innerHTML = `<button id="loginBtn">Đăng nhập Google</button>`;
        document.getElementById("loginBtn").onclick = async () => {
          try {
            await signInWithPopup(auth, provider);
          } catch (err) {
            alert("Lỗi đăng nhập: " + err.message);
          }
        };
      }
    }

    onAuthStateChanged(auth, renderAuthUI);

    document.getElementById("publishBtn").onclick = async () => {
      const title = document.getElementById("videoTitle").value.trim();
      const url = document.getElementById("videoUrl").value.trim();
      const status = document.getElementById("uploadStatus");

      if (!currentUser) {
        status.textContent = "Vui lòng đăng nhập Google trước.";
        return;
      }
      if (!title || !url) {
        status.textContent = "Vui lòng nhập đầy đủ tên video và link video.";
        return;
      }

      status.textContent = "Đang lưu video...";
      try {
        await addDoc(collection(db, "videos"), {
          title,
          url,
          author: currentUser.displayName || currentUser.email,
          createdAt: serverTimestamp()
        });
        document.getElementById("videoTitle").value = "";
        document.getElementById("videoUrl").value = "";
        status.textContent = "Đăng video thành công!";
        await loadVideos();
      } catch (err) {
        status.textContent = "Lỗi khi đăng: " + err.message;
      }
    };

    function renderVideos(items) {
      if (!items.length) {
        videoList.innerHTML = `<p style="color:#94a3b8;">Chưa có video nào phù hợp.</p>`;
        return;
      }
      videoList.innerHTML = items.map(v => {
        const isMp4 = /\.mp4(\?.*)?$/i.test(v.url);
        const player = isMp4
          ? `<video src="${v.url}" controls preload="metadata"></video>`
          : `<iframe src="${v.url}" allowfullscreen></iframe>`;
        return `
          <div class="video-card">
            ${player}
            <div class="video-info">
              <p class="video-title">${v.title}</p>
              <div class="video-meta">Đăng bởi: ${v.author || "Người dùng"}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function loadVideos() {
      try {
        const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        allVideos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        filterAndRender();
      } catch (err) {
        videoList.innerHTML = `<p style="color:#f87171;">Chưa tải được danh sách: ${err.message}</p>`;
      }
    }

    function filterAndRender() {
      const kw = searchInput.value.trim().toLowerCase();
      if (!kw) return renderVideos(allVideos);
      renderVideos(allVideos.filter(v => (v.title || "").toLowerCase().includes(kw)));
    }

    searchInput.addEventListener("input", filterAndRender);
    loadVideos();
  </script>
</body>
</html>
