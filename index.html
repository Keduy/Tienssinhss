<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiensinhsss — Xem & Chia Sẻ Video</title>
  <meta name="description" content="Tiensinhsss - Nền tảng tìm kiếm, xem và chia sẻ video trực tuyến." />
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; }
    header {
      background: #1e293b; padding: 14px 18px; display: flex; flex-wrap: wrap;
      gap: 10px; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #334155;
    }
    .brand { font-size: 1.35rem; font-weight: 800; color: #38bdf8; letter-spacing: 0.5px; }
    .search-box { flex: 1; min-width: 200px; max-width: 420px; }
    input, button {
      padding: 10px 12px; border-radius: 8px; border: 1px solid #475569;
      font-size: 0.95rem;
    }
    input { width: 100%; background: #0f172a; color: #f8fafc; }
    button { background: #0284c7; color: #fff; border: none; font-weight: 600; cursor: pointer; }
    button:hover { background: #0369a1; }
    button.secondary { background: #334155; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 16px; margin-bottom: 20px;
    }
    .upload-grid { display: grid; gap: 10px; }
    .video-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .video-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      overflow: hidden; display: flex; flex-direction: column;
    }
    video, iframe { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 0; }
    .video-info { padding: 12px; }
    .video-title { font-weight: 700; margin: 0 0 6px; font-size: 1rem; }
    .video-meta { font-size: 0.82rem; color: #94a3b8; }
    .status { margin-top: 8px; font-size: 0.9rem; color: #38bdf8; }
    .user-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Tiensinhsss</div>
    <div class="search-box">
      <input id="searchInput" type="search" placeholder="Tìm kiếm video trên Tiensinhsss..." />
    </div>
    <div class="user-bar" id="authArea">
      <button id="loginBtn">Đăng nhập Google</button>
    </div>
  </header>

  <div class="container">
    <div class="card" id="uploadSection" style="display:none;">
      <h3 style="margin-top:0;">Đăng video mới</h3>
      <div class="upload-grid">
        <input id="videoTitle" type="text" placeholder="Tên video / phim" />
        <input id="videoUrl" type="url" placeholder="Dán link video trực tiếp (.mp4) hoặc link embed" />
        <button id="publishBtn">Đăng lên Tiensinhsss</button>
      </div>
      <div class="status" id="uploadStatus"></div>
    </div>

    <div class="card" id="guestNotice">
      Đăng nhập bằng tài khoản Google ở góc trên để đăng video lên <strong>Tiensinhsss</strong>. Khách truy cập có thể tìm kiếm và xem video trực tiếp.
    </div>

    <h3>Danh sách video</h3>
    <div class="video-grid" id="videoList"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcKvdOCQOifuoaez-hFpmf6UtzV3HVnw4",
      authDomain: "tiensinhsss.firebaseapp.com",
      projectId: "tiensinhsss",
      storageBucket: "tiensinhsss.firebasestorage.app",
      messagingSenderId: "293643410016",
      appId: "1:293643410016:web:009dc2495b0c8ea1e50105",
      measurementId: "G-4PW26Q9P0J"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const authArea = document.getElementById("authArea");
    const uploadSection = document.getElementById("uploadSection");
    const guestNotice = document.getElementById("guestNotice");
    const videoList = document.getElementById("videoList");
    const searchInput = document.getElementById("searchInput");

    let currentUser = null;
    let allVideos = [];

    function renderAuthUI(user) {
      currentUser = user;
      if (user) {
        uploadSection.style.display = "block";
        guestNotice.style.display = "none";
        authArea.innerHTML = `
          <span style="font-size:0.88rem;color:#cbd5e1;">${user.displayName || user.email}</span>
          <button class="secondary" id="logoutBtn">Đăng xuất</button>
        `;
        document.getElementById("logoutBtn").onclick = () => signOut(auth);
      } else {
        uploadSection.style.display = "none";
        guestNotice.style.display = "block";
        authArea.innerHTML = `<button id="loginBtn">Đăng nhập Google</button>`;
        document.getElementById("loginBtn").onclick = async () => {
          try {
            await signInWithPopup(auth, provider);
          } catch (err) {
            alert("Lỗi đăng nhập: " + err.message);
          }
        };
      }
    }

    onAuthStateChanged(auth, renderAuthUI);

    document.getElementById("publishBtn").onclick = async () => {
      const title = document.getElementById("videoTitle").value.trim();
      const url = document.getElementById("videoUrl").value.trim();
      const status = document.getElementById("uploadStatus");

      if (!currentUser) {
        status.textContent = "Vui lòng đăng nhập Google trước.";
        return;
      }
      if (!title || !url) {
        status.textContent = "Vui lòng nhập đầy đủ tên video và link video.";
        return;
      }

      status.textContent = "Đang lưu video...";
      try {
        await addDoc(collection(db, "videos"), {
          title,
          url,
          author: currentUser.displayName || currentUser.email,
          createdAt: serverTimestamp()
        });
        document.getElementById("videoTitle").value = "";
        document.getElementById("videoUrl").value = "";
        status.textContent = "Đăng video thành công!";
        await loadVideos();
      } catch (err) {
        status.textContent = "Lỗi khi đăng: " + err.message;
      }
    };

    function renderVideos(items) {
      if (!items.length) {
        videoList.innerHTML = `<p style="color:#94a3b8;">Chưa có video nào phù hợp.</p>`;
        return;
      }
      videoList.innerHTML = items.map(v => {
        const isMp4 = /\.mp4(\?.*)?$/i.test(v.url);
        const player = isMp4
          ? `<video src="${v.url}" controls preload="metadata"></video>`
          : `<iframe src="${v.url}" allowfullscreen></iframe>`;
        return `
          <div class="video-card">
            ${player}
            <div class="video-info">
              <p class="video-title">${v.title}</p>
              <div class="video-meta">Đăng bởi: ${v.author || "Người dùng"}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function loadVideos() {
      try {
        const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        allVideos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        filterAndRender();
      } catch (err) {
        videoList.innerHTML = `<p style="color:#f87171;">Chưa tải được danh sách: ${err.message}</p>`;
      }
    }

    function filterAndRender() {
      const kw = searchInput.value.trim().toLowerCase();
      if (!kw) return renderVideos(allVideos);
      renderVideos(allVideos.filter(v => (v.title || "").toLowerCase().includes(kw)));
    }

    searchInput.addEventListener("input", filterAndRender);
    loadVideos();
  </script>
</body>
</html>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcKvdOCQOifuoaez-hFpmf6UtzV3HVnw4",
      authDomain: "tiensinhsss.firebaseapp.com",
      projectId: "tiensinhsss",
      storageBucket: "tiensinhsss.firebasestorage.app",
      messagingSenderId: "293643410016",
      appId: "1:293643410016:web:009dc2495b0c8ea1e50105",
      measurementId: "G-4PW26Q9P0J"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const PAGE_SIZE = 9;
    const DEFAULT_TAGS = ["Tất cả", "3D / Hoạt hình", "TikTok / Short", "Giải trí", "Khác"];

    const authArea = document.getElementById("authArea");
    const uploadSection = document.getElementById("uploadSection");
    const guestNotice = document.getElementById("guestNotice");
    const searchInput = document.getElementById("search");
    const tagsEl = document.getElementById("tags");
    const mainEl = document.getElementById("main");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const currentEl = document.getElementById("current");
    const overlayEl = document.getElementById("myNav");
    const overlayContentEl = document.getElementById("overlay-content");
    const leftArrow = document.getElementById("left-arrow");
    const rightArrow = document.getElementById("right-arrow");

    let currentUser = null;
    let allVideos = [];
    let filteredVideos = [];
    let selectedTag = "Tất cả";
    let currentPage = 1;
    let overlayIndex = 0;

    function normalizeMediaUrl(rawUrl) {
      const trimmed = (rawUrl || "").trim();
      const ttMatch = trimmed.match(/tiktok\.com\/(?:@[^/]+\/video\/|embed\/v2\/|v\/)(\d+)/i);
      if (ttMatch && ttMatch[1]) {
        return {
          url: `https://www.tiktok.com/embed/v2/${ttMatch[1]}`,
          isDirect: false,
          isVertical: true
        };
      }
      const ytWatchMatch = trimmed.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
      if (ytWatchMatch && ytWatchMatch[1]) {
        return {
          url: `https://www.youtube.com/embed/${ytWatchMatch[1]}`,
          isDirect: false,
          isVertical: false
        };
      }
      const isDirect = /\.(mp4|webm|ogg)(\?.*)?$/i.test(trimmed);
      const isVertical = /tiktok\.com\/embed\/v2\//i.test(trimmed);
      return { url: trimmed, isDirect, isVertical };
    }

    function buildPlayerHtml(rawUrl, autoplay = false) {
      const info = normalizeMediaUrl(rawUrl);
      if (!info.url) {
        return `<div class="player-wrap"></div>`;
      }
      const wrapClass = info.isVertical ? "player-wrap vertical" : "player-wrap";
      const mediaTag = info.isDirect
        ? `<video src="${info.url}" controls preload="metadata" ${autoplay ? "autoplay" : ""}></video>`
        : `<iframe src="${info.url}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen loading="lazy"></iframe>`;
      return `<div class="${wrapClass}">${mediaTag}</div>`;
    }

    function renderAuthUI(user) {
      currentUser = user;
      if (user) {
        uploadSection.style.display = "block";
        guestNotice.style.display = "none";
        authArea.innerHTML = `
          <span style="font-size:0.86rem;color:#cbd5e1;">${user.displayName || user.email}</span>
          <button class="secondary" id="logoutBtn">Đăng xuất</button>
        `;
        document.getElementById("logoutBtn").onclick = () => signOut(auth);
      } else {
        uploadSection.style.display = "none";
        guestNotice.style.display = "block";
        authArea.innerHTML = `<button id="loginBtn">Đăng nhập Google</button>`;
        document.getElementById("loginBtn").onclick = async () => {
          try {
            await signInWithPopup(auth, provider);
          } catch (err) {
            alert("Lỗi đăng nhập: " + err.message);
          }
        };
      }
    }

    onAuthStateChanged(auth, renderAuthUI);

    function renderTags() {
      const dynamicTags = allVideos.map(v => (v.tag || "").trim()).filter(Boolean);
      const tags = Array.from(new Set([...DEFAULT_TAGS, ...dynamicTags]));
      tagsEl.innerHTML = tags.map(t => {
        const activeClass = t === selectedTag ? "tag active" : "tag";
        return `<div class="${activeClass}" data-tag="${t}">${t}</div>`;
      }).join("");

      tagsEl.querySelectorAll(".tag").forEach(el => {
        el.onclick = () => {
          selectedTag = el.dataset.tag;
          currentPage = 1;
          renderTags();
          applyFilters();
        };
      });
    }

    function applyFilters() {
      const kw = searchInput.value.trim().toLowerCase();
      filteredVideos = allVideos.filter(v => {
        const title = (v.title || "").toLowerCase();
        const tag = (v.tag || "Khác").trim();
        const matchTag = selectedTag === "Tất cả" || tag.toLowerCase() === selectedTag.toLowerCase();
        const matchKw = !kw || title.includes(kw) || tag.toLowerCase().includes(kw);
        return matchTag && matchKw;
      });

      const totalPages = Math.max(1, Math.ceil(filteredVideos.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      renderPage(totalPages);
    }

    function renderPage(totalPages) {
      const start = (currentPage - 1) * PAGE_SIZE;
      const items = filteredVideos.slice(start, start + PAGE_SIZE);

      currentEl.textContent = `${currentPage} / ${totalPages}`;
      prevBtn.classList.toggle("disabled", currentPage <= 1);
      nextBtn.classList.toggle("disabled", currentPage >= totalPages);

      if (!items.length) {
        mainEl.innerHTML = `<div class="empty-msg">Chưa có video nào khớp với bộ lọc hiện tại.</div>`;
        return;
      }

      mainEl.innerHTML = items.map((v, idx) => {
        const globalIdx = start + idx;
        return `
          <article class="movie-card">
            ${buildPlayerHtml(v.url, false)}
            <div class="movie-body">
              <h4 class="movie-title">${v.title || "Video không tên"}</h4>
              <div class="movie-meta">
                <span>${v.tag || "Khác"}</span>
                <span>${v.author || "Thành viên"}</span>
              </div>
              <div class="card-actions">
                <button class="secondary" onclick="openOverlay(${globalIdx})">Xem khung lớn</button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderOverlayItem() {
      if (!filteredVideos.length) return;
      const item = filteredVideos[overlayIndex];
      overlayContentEl.innerHTML = `
        <h3 style="margin:0 0 12px;">${item.title || "Video"}</h3>
        ${buildPlayerHtml(item.url, true)}
        <div class="movie-meta" style="margin-top:12px;">
          <span>Nhãn: ${item.tag || "Khác"}</span>
          <span>Đăng bởi: ${item.author || "Thành viên"}</span>
        </div>
      `;
    }

    window.openOverlay = function(index) {
      overlayIndex = Math.max(0, Math.min(index, filteredVideos.length - 1));
      renderOverlayItem();
      overlayEl.style.width = "100%";
    };

    window.closeNav = function() {
      overlayEl.style.width = "0%";
      overlayContentEl.innerHTML = "";
    };

    leftArrow.onclick = () => {
      if (!filteredVideos.length) return;
      overlayIndex = (overlayIndex - 1 + filteredVideos.length) % filteredVideos.length;
      renderOverlayItem();
    };

    rightArrow.onclick = () => {
      if (!filteredVideos.length) return;
      overlayIndex = (overlayIndex + 1) % filteredVideos.length;
      renderOverlayItem();
    };

    prevBtn.onclick = () => {
      if (currentPage > 1) {
        currentPage--;
        applyFilters();
      }
    };

    nextBtn.onclick = () => {
      const totalPages = Math.max(1, Math.ceil(filteredVideos.length / PAGE_SIZE));
      if (currentPage < totalPages) {
        currentPage++;
        applyFilters();
      }
    };

    searchInput.addEventListener("input", () => {
      currentPage = 1;
      applyFilters();
    });

    document.getElementById("publishBtn").onclick = async () => {
      const title = document.getElementById("videoTitle").value.trim();
      const tag = document.getElementById("videoTag").value.trim() || "Khác";
      const url = document.getElementById("videoUrl").value.trim();
      const status = document.getElementById("uploadStatus");

      if (!currentUser) {
        status.textContent = "Vui lòng đăng nhập Google trước.";
        return;
      }
      if (!title || !url) {
        status.textContent = "Vui lòng nhập tên video và đường link video/nhúng.";
        return;
      }

      try {
        status.textContent = "Đang lưu video lên Tiensinhsss...";
        await addDoc(collection(db, "videos"), {
          title,
          tag,
          url,
          author: currentUser.displayName || currentUser.email,
          createdAt: serverTimestamp()
        });
        document.getElementById("videoTitle").value = "";
        document.getElementById("videoTag").value = "";
        document.getElementById("videoUrl").value = "";
        status.textContent = "Đăng video thành công!";
        await loadVideos();
      } catch (err) {
        status.textContent = "Lỗi khi đăng: " + err.message;
      }
    };

    async function loadVideos() {
      try {
        const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        allVideos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderTags();
        applyFilters();
      } catch (err) {
        mainEl.innerHTML = `<div class="empty-msg" style="color:#f87171;">Không tải được danh sách: ${err.message}</div>`;
      }
    }

    renderTags();
    loadVideos();
  </script>
</body>
</html>
